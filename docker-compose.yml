services:
  postgres:
    image: postgres:16
    container_name: mercado-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - mercado-app-data:/var/lib/postgresql/data

volumes:
  mercado-app-data: